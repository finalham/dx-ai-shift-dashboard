<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>DX/生成AIシフト ダッシュボード</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; }
    h1 { text-align: center; margin: 20px 0; }
    #chartContainer { width: 400px; margin: auto; }
    #cards { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
      gap: 15px; 
      margin: 20px; 
    }
    .card {
      background: #1e1e1e; 
      border-radius: 10px; 
      padding: 15px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .timestamp { font-size: 0.8em; color: #aaa; margin-bottom: 10px; }
    .markdown { line-height: 1.4; }
    button {
      display: block;
      margin: 10px auto;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #2196f3;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #1976d2; }
  </style>
</head>
<body>
  <h1>DX/生成AIシフト ダッシュボード</h1>
  <div id="chartContainer">
    <canvas id="categoryChart"></canvas>
  </div>
  <button onclick="loadData()">🔄 更新</button>
  <h2 style="text-align:center;">カテゴリ別アイデア一覧</h2>
  <div id="cards"></div>

  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1kFDpZLR25uSxyyWaohzBF1IYPM7s-pomEFpzMFVuDZ8/gviz/tq?tqx=out:csv&sheet=summary";

    let chart, categories = {};

    // ✅ カテゴリ分類ルール
    function classify(summary) {
      if (/効率|短縮|削減/.test(summary)) return "業務効率化";
      if (/売上|収益|利益/.test(summary)) return "収益アップ";
      if (/顧客|満足|エンゲージ/.test(summary)) return "エンゲージメント";
      if (/環境|ESG|サステナ/.test(summary)) return "環境/ESG";
      return "未分類";
    }

    // ✅ CSVをJSON化
    function csvToJSON(csv) {
      const lines = csv.split("\n").filter(l => l.trim() !== "");
      const headers = lines[0].split(",");
      return lines.slice(1).map(line => {
        const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); // カンマ区切り (クォート対応)
        let obj = {};
        headers.forEach((h,i) => obj[h.trim()] = cols[i] ? cols[i].replace(/^"|"$/g,"") : "");
        return obj;
      });
    }

    // ✅ データ取得して更新
    async function loadData() {
      const res = await fetch(SHEET_URL);
      const text = await res.text();
      const rows = csvToJSON(text);

      // reset
      categories = {};

      rows.forEach(row => {
        const summary = row.final_summary || "";
        const ts = row.timestamp || "";
        const cat = classify(summary);
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push({ timestamp: ts, final_summary: summary });
      });

      updateChart();
    }

    // ✅ グラフ更新
    function updateChart() {
      const ctx = document.getElementById('categoryChart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: Object.keys(categories),
          datasets: [{
            data: Object.values(categories).map(arr => arr.length),
            backgroundColor: ["#4caf50","#2196f3","#ff9800","#9c27b0","#607d8b"]
          }]
        },
        options: {
          onClick: (e, elements) => {
            if (elements.length > 0) {
              const idx = elements[0].index;
              const category = chart.data.labels[idx];
              renderCards(category);
            }
          }
        }
      });
    }

    // ✅ カード描画
    function renderCards(category) {
      const container = document.getElementById("cards");
      container.innerHTML = "";
      categories[category].forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="timestamp">${item.timestamp}</div>
          <div class="markdown">${marked.parse(item.final_summary)}</div>
        `;
        container.appendChild(card);
      });
    }

    // 初期ロード
    loadData();
  </script>
</body>
</html>
